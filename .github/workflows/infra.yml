# KidTracker — Infrastructure: Terraform + Firestore rules
# Runs on changes to terraform/, firestore.rules, or manually.
# Does NOT build or deploy the app.

name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

env:
  PROJECT_ID: kidcare-17eba
  REGION: europe-west1

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Refresh
        run: terraform refresh
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Deploy Firestore rules to kidcare database
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          jq -n --arg content "$(cat firestore.rules)" \
            '{source: {files: [{name: "firestore.rules", content: $content}]}}' > /tmp/ruleset.json

          echo "--- Creating ruleset ---"
          RULESET_RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://firebaserules.googleapis.com/v1/projects/${{ env.PROJECT_ID }}/rulesets" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/ruleset.json)

          HTTP_STATUS=$(echo "$RULESET_RESPONSE" | tail -1 | sed 's/HTTP_STATUS://')
          BODY=$(echo "$RULESET_RESPONSE" | sed '$d')
          echo "HTTP $HTTP_STATUS"
          echo "$BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Create ruleset returned HTTP $HTTP_STATUS"
            exit 1
          fi

          RULESET_NAME=$(echo "$BODY" | jq -r '.name')
          echo "Created ruleset: $RULESET_NAME"

          RELEASE_BODY=$(jq -n --arg name "projects/${{ env.PROJECT_ID }}/releases/cloud.firestore/kidcare" \
            --arg ruleset "$RULESET_NAME" \
            '{release: {name: $name, rulesetName: $ruleset}}')

          echo "--- Updating release (PATCH) ---"
          PATCH_RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X PATCH \
            "https://firebaserules.googleapis.com/v1/projects/${{ env.PROJECT_ID }}/releases/cloud.firestore%2Fkidcare" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$RELEASE_BODY")

          PATCH_STATUS=$(echo "$PATCH_RESPONSE" | tail -1 | sed 's/HTTP_STATUS://')
          PATCH_BODY=$(echo "$PATCH_RESPONSE" | sed '$d')
          echo "PATCH HTTP $PATCH_STATUS"
          echo "$PATCH_BODY"

          if [ "$PATCH_STATUS" != "200" ]; then
            echo "--- PATCH failed, trying POST ---"
            POST_RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "https://firebaserules.googleapis.com/v1/projects/${{ env.PROJECT_ID }}/releases" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$RELEASE_BODY")

            POST_STATUS=$(echo "$POST_RESPONSE" | tail -1 | sed 's/HTTP_STATUS://')
            POST_BODY=$(echo "$POST_RESPONSE" | sed '$d')
            echo "POST HTTP $POST_STATUS"
            echo "$POST_BODY"

            if [ "$POST_STATUS" != "200" ]; then
              echo "ERROR: Both PATCH and POST failed"
              exit 1
            fi
          fi

          echo "Firestore rules deployed to kidcare database"
