# KidTracker — App Deploy: Docker image + Cloud Run + Firebase Hosting
# Runs on code changes (excludes infra-only files).
# Assumes infrastructure (Terraform) is already applied via infra.yml.

name: Deploy App

on:
  push:
    branches: [main]
    paths-ignore:
      - 'terraform/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/infra.yml'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

env:
  PROJECT_ID: kidcare-17eba
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/kidcare-17eba/kidtracker/api

jobs:
  deploy-backend:
    name: Build & Deploy API → Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      cloud_run_url: ${{ steps.tf_output.outputs.cloud_run_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy kidtracker-api \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --quiet

      - name: Get Cloud Run URL
        id: tf_output
        run: |
          URL=$(gcloud run services describe kidtracker-api --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format='value(status.url)')
          echo "cloud_run_url=$URL" >> $GITHUB_OUTPUT
          echo "Cloud Run URL: $URL" >> $GITHUB_STEP_SUMMARY

  deploy-frontend:
    name: Build & Deploy Frontend → Firebase Hosting
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-backend.outputs.cloud_run_url }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project ${{ env.PROJECT_ID }} --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
